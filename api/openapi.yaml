openapi: 3.0.3
info:
  title: NFL Library API
  version: 0.1.0
  description: NFL Library の API 仕様。エンドポイントの追加・変更は本ファイルを先に更新する。

servers:
  - url: http://localhost:8080
    description: ローカル開発

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness チェック
      tags: [system]
      responses:
        "200":
          description: プロセスが稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness チェック（DB 接続を確認）
      tags: [system]
      responses:
        "200":
          description: 依存先に接続可能
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 依存先に接続不可
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/rosters:
    get:
      operationId: getRosters
      summary: シーズン・チームで絞り込んでロスター一覧を取得する
      tags: [rosters]
      parameters:
        - name: season
          in: query
          required: true
          description: 対象シーズン（2012以降）
          schema:
            type: integer
            minimum: 2012
            example: 2024
        - name: team_id
          in: query
          required: true
          description: チームID（teamsテーブルの id。1〜32）
          schema:
            type: integer
            minimum: 1
            maximum: 32
            example: 1
        - name: name
          in: query
          required: false
          description: >-
            選手名の部分一致検索（firstname・lastname のいずれかに部分一致。大文字小文字は区別しない）。
            複数の語を指定するとOR条件で絞り込む（いずれか1語でも一致すれば対象）。繰り返し指定
            （name=Josh&name=Allen）とカンマ区切りの1つの値（name=Josh,Allen）のどちらでも指定できる。
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example: [Josh, Allen]
        - name: sort_by
          in: query
          required: false
          description: 並び替え対象の項目（省略時は rating）
          schema:
            type: string
            enum: [rating, number, experience, name]
            default: rating
        - name: sort_order
          in: query
          required: false
          description: >-
            並び替え順（省略時は desc）。rating・number・experience が未設定（null）の roster は
            昇順・降順どちらでも常に最後になる。
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: 取得成功（該当データが無い場合も rosters は空配列で 200 を返す）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RosterListData"
        "422":
          description: クエリパラメータが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
        "500":
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/search/seasons:
    get:
      operationId: getSearchSeasons
      summary: ロスターが存在するシーズン一覧を取得する（検索UIの選択肢用）
      tags: [search]
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SeasonListData"
        "500":
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/search/teams:
    get:
      operationId: getSearchTeams
      summary: チーム一覧を取得する（検索UIの選択肢用）
      tags: [search]
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TeamListData"
        "500":
          description: サーバー内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    # --- 共通エンベロープ ---
    # 成功・エラー・バリデーションエラーのいずれも message を持つ。data の内容はエンドポイントごとに異なる。
    SuccessEnvelope:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
          example: ロスター情報を取得しました
        data:
          type: object

    ErrorEnvelope:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          example: サーバー内部でエラーが発生しました
        code:
          $ref: "#/components/schemas/ErrorCode"

    ValidationErrorEnvelope:
      type: object
      required: [message, code, errors]
      properties:
        message:
          type: string
          example: 入力値が不正です
        code:
          $ref: "#/components/schemas/ErrorCode"
        errors:
          type: object
          description: フィールド名 → エラーメッセージ一覧
          additionalProperties:
            type: array
            items:
              type: string
          example:
            season: ["2012以降の値を指定してください"]

    ErrorCode:
      type: string
      description: |
        アプリ独自の機械可読なエラーコード。HTTP ステータスとは別軸で管理する。
          E0001: 入力値が不正（バリデーションエラー）
          E0002: 認証されていない
          E0003: 権限がない
          E0004: リソースが見つからない
          E0005: リソースが競合している
          E0006: サーバー内部エラー
          E0007: 依存先サービスが利用不可
      enum: [E0001, E0002, E0003, E0004, E0005, E0006, E0007]
      example: E0001

    # --- /api/v1/rosters ---
    RosterListData:
      type: object
      required: [rosters]
      properties:
        rosters:
          type: array
          items:
            $ref: "#/components/schemas/Roster"

    Roster:
      type: object
      required:
        [id, season, team_id, player_id, position_id, player, position, madden_attributes]
      properties:
        id:
          type: integer
        season:
          type: integer
        team_id:
          type: integer
        player_id:
          type: integer
        position_id:
          type: integer
        number:
          type: integer
          nullable: true
        rating:
          type: integer
          nullable: true
        experience:
          type: integer
          nullable: true
        player:
          $ref: "#/components/schemas/RosterPlayer"
        position:
          $ref: "#/components/schemas/RosterPosition"
        madden_attributes:
          type: array
          description: Madden NFL の評価値CSVのうち、rosters の他の列に対応しない項目一式。
          items:
            $ref: "#/components/schemas/MaddenAttribute"

    RosterPlayer:
      type: object
      required: [id, firstname, lastname, birthday]
      properties:
        id:
          type: integer
        firstname:
          type: string
        lastname:
          type: string
        birthday:
          type: string
          description: "YYYYMMDD 形式"
          example: "19960521"
        height:
          type: number
          nullable: true
        weight:
          type: number
          nullable: true
        college:
          type: string
          nullable: true
        drafted_team:
          type: string
          nullable: true
        drafted_round:
          type: string
          nullable: true
        drafted_rank:
          type: string
          nullable: true
        drafted_year:
          type: integer
          nullable: true
        image_file:
          type: string
          nullable: true
        birthday_year:
          type: integer
          nullable: true
        birthday_date:
          type: string
          nullable: true
          example: "1996年05月21日"
        image_url:
          type: string
          nullable: true

    RosterPosition:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        abstract_category:
          type: integer
          nullable: true
        category:
          type: integer
          nullable: true
        name:
          type: string
        odflg:
          type: integer
          description: "攻守フラグ（1: Offence, 0: Defence）"
          nullable: true

    MaddenAttribute:
      type: object
      required: [key, label, value]
      properties:
        key:
          type: string
          description: CSV ヘッダーそのまま（表記ゆれを含む）
          example: stats/speed/value
        label:
          type: string
          description: 日本語名
          example: スピード
        value:
          type: string

    # --- /api/v1/search/seasons ---
    SeasonListData:
      type: object
      required: [seasons]
      properties:
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"

    Season:
      type: object
      required: [season]
      properties:
        season:
          type: integer
          example: 2024

    # --- /api/v1/search/teams ---
    TeamListData:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"

    Team:
      type: object
      required: [id, city, name, conference, area]
      properties:
        id:
          type: integer
        city:
          type: string
          example: Buffalo
        name:
          type: string
          example: Bills
        conference:
          type: string
          description: "表示用ラベル（1: AFC, 2: NFC）"
          example: AFC
        area:
          type: string
          description: "表示用ラベル（1: 東, 2: 北, 3: 南, 4: 西）"
          example: 東
        image_file:
          type: string
          nullable: true
          example: bills.gif
        back_image_file:
          type: string
          nullable: true
          example: bills_cover.jpg
